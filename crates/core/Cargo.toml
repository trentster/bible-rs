[package]
name = "bible-core"
description = "Translation model, importers, search and study storage for bible-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["bundled", "native"]
# Embed the public-domain translations from data/translations into the binary.
bundled = []
# The translation library and the study store's SQLite file. No network: everything the app could
# fetch was removed on purpose (DECISIONS.md, "Offline, without exceptions"). The web build leaves
# this out and keeps the model, `.bbl` files, chapter layout, search, references and the study
# store in memory.
native = ["import", "dep:rusqlite"]
# The importers (USFM, OSIS, Zefania, SWORD; zips), which the web build takes without `native`
# to convert files the reader picks in the browser.
import = ["dep:zip", "dep:flate2"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
memchr.workspace = true
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }
flate2 = { version = "1", optional = true }

# The C zstd needs a C compiler that targets wasm; the browser decodes with a pure-Rust one.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
# The clock: std has none on wasm32-unknown-unknown.
js-sys = "0.3"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "search"
harness = false

[[bench]]
name = "load"
harness = false
